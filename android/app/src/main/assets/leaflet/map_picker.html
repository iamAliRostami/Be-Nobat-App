<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
            background: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            position: relative;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            min-height: 380px;
            background: #e2e8f0;
            z-index: 1;
        }
        .loc-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 9999;
            background: #ffffff;
            border: 1.5px solid #00796b;
            color: #00796b;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .loc-btn:active {
            background: #e0f2f1;
        }
        .custom-pin {
            font-size: 32px;
            text-align: center;
            line-height: 32px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
            user-select: none;
        }
    </style>
    <script src="leaflet.js"></script>
</head>
<body>
    <button type="button" class="loc-btn" onclick="locateMe()">📍 موقعیت من</button>
    <div id="map"></div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var initialLat = parseFloat(params.get('lat')) || 32.6546;
        var initialLng = parseFloat(params.get('lng')) || 51.6680;
        var zoomLevel = parseInt(params.get('zoom')) || 14;

        if (window.L && window.L.Icon && window.L.Icon.Default) {
            window.L.Icon.Default.imagePath = './';
        }

        var map = L.map('map', {
            center: [initialLat, initialLng],
            zoom: zoomLevel,
            zoomControl: true
        });
        window.map = map;

        // High-speed, high-availability tiles worldwide and in Iran
        var tileLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['0', '1', '2', '3'],
            attribution: '© Google Maps © OpenStreetMap'
        }).addTo(map);

        tileLayer.on('tileerror', function(err) {
            if (err && err.tile && !err.tile._triedCarto && err.coords) {
                err.tile._triedCarto = true;
                err.tile.src = 'https://basemaps.cartocdn.com/rastertiles/voyager/' + err.coords.z + '/' + err.coords.x + '/' + err.coords.y + '.png';
            } else if (err && err.tile && !err.tile._triedOsm && err.coords) {
                err.tile._triedOsm = true;
                err.tile.src = 'https://tile.openstreetmap.org/' + err.coords.z + '/' + err.coords.x + '/' + err.coords.y + '.png';
            } else if (err && err.tile && !err.tile._triedProxy && err.coords) {
                err.tile._triedProxy = true;
                err.tile.src = 'http://10.0.2.2:8080/api/map/tile/' + err.coords.z + '/' + err.coords.x + '/' + err.coords.y + '.png';
            }
        });

        var pinIcon = L.divIcon({
            className: 'custom-pin',
            html: '📍',
            iconSize: [36, 36],
            iconAnchor: [18, 34]
        });

        var marker = L.marker([initialLat, initialLng], {
            icon: pinIcon,
            draggable: true
        }).addTo(map);

        function notifyAndroid(lat, lng) {
            if (window.AndroidBridge && window.AndroidBridge.onLocationChanged) {
                window.AndroidBridge.onLocationChanged(lat, lng);
            }
        }

        marker.on('dragend', function(e) {
            var p = e.target.getLatLng();
            notifyAndroid(p.lat, p.lng);
        });

        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            notifyAndroid(e.latlng.lat, e.latlng.lng);
        });

        function locateMe() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(pos) {
                    var c = [pos.coords.latitude, pos.coords.longitude];
                    map.setView(c, 16);
                    marker.setLatLng(c);
                    notifyAndroid(pos.coords.latitude, pos.coords.longitude);
                }, function() {
                    alert('امکان دریافت موقعیت مکانی GPS فراهم نشد.');
                });
            }
        }

        function fitMap() {
            var el = document.getElementById('map');
            if (el) {
                var w = window.innerWidth || document.documentElement.clientWidth;
                var h = window.innerHeight || document.documentElement.clientHeight;
                if (w > 0) el.style.width = w + 'px';
                if (h > 0) el.style.height = h + 'px';
            }
            if (window.map) {
                window.map.invalidateSize();
            }
        }
        window.fitMap = fitMap;
        window.addEventListener('resize', fitMap);

        [50, 150, 300, 600, 1000, 2000].forEach(function(delay) {
            setTimeout(fitMap, delay);
        });
    </script>
</body>
</html>
