services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: benobat
      POSTGRES_USER: benobat
      POSTGRES_PASSWORD: benobat-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benobat -d benobat"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: Host=services.irn4.chabokan.net;Port=46612;Database=isabell;Username=postgres;Password=g7P9IjpYRGrlHFXe;SSL Mode=Prefer;Trust Server Certificate=true
      DataProtection__KeysPath: /keys
    volumes:
      - dataprotection_keys:/keys
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  seed-demo:
    profiles: ["demo"]
    build: .
    command: ["--seed-demo"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=services.irn4.chabokan.net;Port=46612;Database=isabell;Username=postgres;Password=g7P9IjpYRGrlHFXe;SSL Mode=Prefer;Trust Server Certificate=true
      DataProtection__KeysPath: /keys
      Seed__DemoPassword: Demo123456
    volumes:
      - dataprotection_keys:/keys
    depends_on:
      postgres:
        condition: service_healthy

  reset-demo:
    profiles: ["demo"]
    build: .
    command: ["--reset-demo"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=services.irn4.chabokan.net;Port=46612;Database=isabell;Username=postgres;Password=g7P9IjpYRGrlHFXe;SSL Mode=Prefer;Trust Server Certificate=true
      DataProtection__KeysPath: /keys
      Seed__DemoPassword: Demo123456
    volumes:
      - dataprotection_keys:/keys
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  dataprotection_keys:
