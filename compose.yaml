services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: benobat
      POSTGRES_USER: benobat
      POSTGRES_PASSWORD: benobat-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benobat -d benobat"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=benobat;Username=benobat;Password=benobat-dev-only
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
