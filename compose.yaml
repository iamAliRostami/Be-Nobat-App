services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: benobat
      POSTGRES_USER: benobat
      POSTGRES_PASSWORD: benobat-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benobat -d benobat"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=benobat;Username=benobat;Password=benobat-dev-only
      DataProtection__KeysPath: /keys
    volumes:
      - dataprotection_keys:/keys
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  seed-demo:
    profiles: ["demo"]
    build: .
    command: ["--seed-demo"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=benobat;Username=benobat;Password=benobat-dev-only
      Seed__DemoPassword: Demo123456
    depends_on:
      postgres:
        condition: service_healthy

  reset-demo:
    profiles: ["demo"]
    build: .
    command: ["--reset-demo"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=benobat;Username=benobat;Password=benobat-dev-only
      Seed__DemoPassword: Demo123456
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  dataprotection_keys:
